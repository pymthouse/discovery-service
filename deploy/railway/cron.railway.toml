# Legacy Railway cron service config.
# discoveryd now runs internal hourly refresh scheduling by default.
# Do not deploy this in the normal production stack.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/cron/Dockerfile"

[deploy]
# Cron jobs are not long-running; numReplicas = 1, triggered by schedule
restartPolicyType = "NEVER"
